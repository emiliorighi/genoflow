server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream parquet;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json text/plain image/svg+xml application/wasm;

    location = / { return 302 /genoflow/; }

    location /genoflow/_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /genoflow/data/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /genoflow/ {
        try_files $uri $uri/ $uri.html =404;
    }
}
