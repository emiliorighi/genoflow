name: Build and push Docker image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: NEXT_PUBLIC_BASE_PATH=/genoflow
          push: true
          tags: |
            ghcr.io/emiliorighi/genoflow:latest
            ghcr.io/emiliorighi/genoflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
