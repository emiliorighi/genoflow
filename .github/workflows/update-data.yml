# Weekly data pipeline: fetch NCBI/ENA/ROR data, rebuild parquet + landing stats,
# commit only when outputs change, then dispatch the Pages deploy workflow.
#
# Required secret (Settings → Secrets and variables → Actions):
#   ROR_CLIENT_ID  — ROR API Client-Id header for resolve_submitter_institutes.py
#
# Optional (not used yet):
#   NCBI_API_KEY   — higher rate limits for the NCBI datasets CLI
#
# Manual run: Actions → "Update data pipeline" → Run workflow

name: Update data pipeline

on:
  schedule:
    # Mondays 04:17 UTC
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install NCBI datasets CLI
        run: |
          curl -fsSL -o /tmp/datasets \
            https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets
          sudo install -m 0755 /tmp/datasets /usr/local/bin/datasets
          datasets version

      - name: Require ROR_CLIENT_ID secret
        env:
          ROR_CLIENT_ID: ${{ secrets.ROR_CLIENT_ID }}
        run: |
          if [ -z "$ROR_CLIENT_ID" ]; then
            echo "ERROR: Set repository secret ROR_CLIENT_ID (ROR API Client-Id)." >&2
            exit 1
          fi

      - name: Run data pipeline
        env:
          ROR_CLIENT_ID: ${{ secrets.ROR_CLIENT_ID }}
        run: ./scripts/run_data_pipeline.sh

      - name: Detect data changes
        id: changes
        run: |
          TRACKED=(
            data/eukaryote_assemblies.tsv
            data/taxonomic_tree.tsv
            data/submitter_institutes.tsv
            data/raw/ena_taxonomy_nodes.jsonl
            data/raw/ror_submitter_cache.jsonl
            assemblage/public/data/species_flows.parquet
            assemblage/public/data/landing-stats.json
          )
          git add -- "${TRACKED[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tracked data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tracked data files changed:"
            git diff --cached --stat
          fi

      - name: Commit and push data updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): weekly pipeline update $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Dispatch Pages deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"
